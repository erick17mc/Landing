        function translateHtml(html, lang) {
            if (lang !== 'es') return html;
            const entries = Object.entries(htmlTranslations.es).sort((a, b) => b[0].length - a[0].length);
            let translated = html;
            for (const [source, target] of entries) {
                translated = translated.replaceAll(source, target);
            }
            return translated;
        }

        function updateLanguageToggleButton() {
            const button = document.getElementById('language-toggle');
            if (!button) return;
            button.textContent = currentLanguage === 'es' ? 'ES' : 'EN';
            button.title = currentLanguage === 'es' ? 'Idioma Español' : 'Language English';
        }

        async function cargarComponente(id, ruta) {
            try {
                const response = await fetch(ruta);
                if (response.ok) {
                    let html = await response.text();
                    html = translateHtml(html, currentLanguage);
                    document.getElementById(id).innerHTML = html;
                    initThumbnailCarousel();
                    if (id === 'hero-pricing-component') {
                        initDynamicPricing();
                    }
                    if (id === 'header-component') {
                        updateLanguageToggleButton();
                        initLanguageToggle();
                    }
                }
            } catch (error) {
                console.error(`Error al cargar el componente ${ruta}:`, error);
            }
        }

        function loadAllComponents() {

        function initLanguageToggle() {
            const button = document.getElementById('language-toggle');
            if (!button) return;
            button.addEventListener('click', () => {
                currentLanguage = currentLanguage === 'en' ? 'es' : 'en';
                localStorage.setItem('language', currentLanguage);
                loadAllComponents();
            });
        }

        function initThumbnailCarousel() {
            document.querySelectorAll('.carousel-container').forEach(container => {
                if (container.dataset.carouselInit === 'true') return;
                container.dataset.carouselInit = 'true';

                const track = container.querySelector('.carousel-track');
                const prev = container.querySelector('.carousel-prev');
                const next = container.querySelector('.carousel-next');
                const overlay = container.querySelector('.carousel-overlay');
                const overlayVideo = container.querySelector('.carousel-overlay-video');
                const overlayClose = container.querySelector('.carousel-overlay-close');
                if (!track || !prev || !next || !overlay || !overlayVideo || !overlayClose) return;

                const scrollAmount = track.clientWidth * 0.75;
                let autoScrollTimer = null;

                function startAutoScroll() {
                    if (autoScrollTimer) return;
                    autoScrollTimer = setInterval(() => {
                        const maxScroll = track.scrollWidth - track.clientWidth;
                        if (track.scrollLeft >= maxScroll - 10) {
                            track.scrollTo({ left: 0, behavior: 'smooth' });
                        } else {
                            track.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                        }
                    }, 3500);
                }

                function stopAutoScroll() {
                    if (!autoScrollTimer) return;
                    clearInterval(autoScrollTimer);
                    autoScrollTimer = null;
                }

                prev.addEventListener('click', () => {
                    stopAutoScroll();
                    track.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                    startAutoScroll();
                });

                next.addEventListener('click', () => {
                    stopAutoScroll();
                    track.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                    startAutoScroll();
                });

                track.addEventListener('mouseenter', stopAutoScroll);
                track.addEventListener('mouseleave', startAutoScroll);
                prev.addEventListener('mouseenter', stopAutoScroll);
                next.addEventListener('mouseenter', stopAutoScroll);

                function openOverlay(sourceUrl, item) {
                    overlayVideo.src = sourceUrl;
                    overlayVideo.load();
                    overlayVideo.play().catch(() => {});
                    overlay.classList.remove('hidden');
                    overlay.classList.add('flex');
                    container.querySelectorAll('.carousel-item').forEach(el => el.classList.remove('active'));
                    if (item) item.classList.add('active');
                }

                function closeOverlay() {
                    overlayVideo.pause();
                    overlayVideo.currentTime = 0;
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                    container.querySelectorAll('.carousel-item').forEach(el => el.classList.remove('active'));
                }

                overlayClose.addEventListener('click', closeOverlay);
                overlay.addEventListener('click', (event) => {
                    if (event.target === overlay) {
                        closeOverlay();
                    }
                });

                container.querySelectorAll('.carousel-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const sourceUrl = item.dataset.videoSrc;
                        if (!sourceUrl) return;
                        stopAutoScroll();
                        openOverlay(sourceUrl, item);
                    });
                });

                startAutoScroll();
            });
        }

        function initDynamicPricing() {
            const selector = document.getElementById('country-selector');
            const priceAmount = document.getElementById('price-amount');
            const comparePrice = document.getElementById('compare-price');
            const priceAmountSecondary = document.getElementById('price-amount-secondary');
            const comparePriceSecondary = document.getElementById('compare-price-secondary');
            const saveAmountSecondary = document.getElementById('save-amount-secondary');
            if (!selector || !priceAmount || !comparePrice || !priceAmountSecondary || !comparePriceSecondary || !saveAmountSecondary) return;

            const pricing = {
                basePriceUSD: 10,
                comparePriceUSD: 25,
                countries: {
                    US: { locale: 'en-US', currency: 'USD', rate: 1 },
                    CA: { locale: 'en-CA', currency: 'CAD', rate: 1.35 },
                    MX: { locale: 'es-MX', currency: 'MXN', rate: 17.5 },
                    BR: { locale: 'pt-BR', currency: 'BRL', rate: 5.3 },
                    AR: { locale: 'es-AR', currency: 'ARS', rate: 980 },
                    CO: { locale: 'es-CO', currency: 'COP', rate: 3572 },
                    CL: { locale: 'es-CL', currency: 'CLP', rate: 840 },
                    PE: { locale: 'es-PE', currency: 'PEN', rate: 3.7 },
                    UY: { locale: 'es-UY', currency: 'UYU', rate: 40 },
                    PY: { locale: 'es-PY', currency: 'PYG', rate: 7700 },
                    BO: { locale: 'es-BO', currency: 'BOB', rate: 6.92 },
                    CR: { locale: 'es-CR', currency: 'CRC', rate: 560 },
                    GT: { locale: 'es-GT', currency: 'GTQ', rate: 7.85 },
                    DO: { locale: 'es-DO', currency: 'DOP', rate: 56.5 },
                    'US-OTHER': { locale: 'en-US', currency: 'USD', rate: 1 }
                }
            };

            function formatValue(amount, locale, currency) {
                return new Intl.NumberFormat(locale, { style: 'currency', currency }).format(amount);
            }

            async function detectCountryCode() {
                try {
                    const response = await fetch('https://ipapi.co/json/');
                    if (!response.ok) return null;
                    const data = await response.json();
                    return data.country_code || null;
                } catch (error) {
                    return null;
                }
            }

            function getDefaultCountryCode() {
                const languageCode = (navigator.language || '').slice(-2).toUpperCase();
                if (pricing.countries[languageCode]) {
                    return languageCode;
                }
                return 'US-OTHER';
            }

            function updatePrices() {
                const selected = selector.value;
                const country = pricing.countries[selected] || pricing.countries['US-OTHER'];
                const amount = pricing.basePriceUSD * country.rate;
                const compare = pricing.comparePriceUSD * country.rate;
                const formattedAmount = formatValue(amount, country.locale, country.currency);
                const formattedCompare = formatValue(compare, country.locale, country.currency);
                const formattedSave = formatValue(compare - amount, country.locale, country.currency);
                priceAmount.textContent = formattedAmount;
                comparePrice.textContent = formattedCompare;
                priceAmountSecondary.textContent = formattedAmount;
                comparePriceSecondary.textContent = formattedCompare;
                saveAmountSecondary.textContent = `Save ${formattedSave}`;
            }

            async function setInitialCountry() {
                const detectedCode = await detectCountryCode();
                if (detectedCode && pricing.countries[detectedCode]) {
                    selector.value = detectedCode;
                } else {
                    selector.value = getDefaultCountryCode();
                }
                updatePrices();
            }

            selector.addEventListener('change', updatePrices);
            setInitialCountry();
        }

            cargarComponente('footer-component', 'components/footer.html');

        // Cuando se vuelve a cargar un componente con HTML dinámico
        document.addEventListener('DOMContentLoaded', () => {
            initDynamicPricing();
        });
